name: Deploy CFNext to Cloudflare

# 部署走 Cloudflare REST API（scripts/deploy.py），不依赖 npm / wrangler：
# wrangler 在 CI 里偶发装不上，且 ES module 上传要特意用
# Content-Type: application/javascript+module，直接用 API 更可控。

on:
  push:
    branches: [main]
    paths:
      - "CFNext 明文版.js"
      - "scripts/deploy.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy to Cloudflare Workers
        run: python scripts/deploy.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          U: ${{ secrets.U }}
